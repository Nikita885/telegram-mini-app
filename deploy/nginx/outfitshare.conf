# nginx on the host in front of the Outfit Share stack (DEPLOY.md, variant A).
#   cp deploy/nginx/outfitshare.conf /etc/nginx/sites-available/outfitshare.conf
#   ln -s /etc/nginx/sites-available/outfitshare.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx && certbot --nginx -d moiservis.pro
# 8010 is APP_PORT from .env.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name moiservis.pro;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite, never append: a client must not be able to choose the address rate limits use.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        # WebSocket (/ws/): chat, typing, notifications, Studio progress.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
