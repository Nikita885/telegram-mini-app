# Версии зафиксированы вручную: Google Maven был недоступен при создании каталога,
# при первой синхронизации проверьте, что AGP и AndroidX резолвятся (Android Studio → Sync).
[versions]
agp = "8.11.1"
compileSdk = "36"
targetSdk = "36"
minSdk = "26"
androidxAppcompat = "1.7.0"
androidxCore = "1.13.1"
androidxCoreSplashscreen = "1.0.1"
androidxDynamicanimation = "1.0.0"
material = "1.12.0"
junit = "4.13.2"
spotless = "7.2.1"
googleJavaFormat = "1.28.0"
checkstyle = "10.21.1"
androidxActivity = "1.9.3"
androidxFragment = "1.8.5"
androidxLifecycle = "2.8.7"
androidxRecyclerview = "1.4.0"
androidxSwiperefresh = "1.1.0"
androidxViewpager2 = "1.1.0"
androidxCamera = "1.4.1"
androidxExif = "1.3.7"
androidxWork = "2.10.0"
retrofit = "2.11.0"
okhttp = "4.12.0"
gson = "2.11.0"
glide = "4.16.0"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidxCoreSplashscreen" }
androidx-dynamicanimation = { module = "androidx.dynamicanimation:dynamicanimation", version.ref = "androidxDynamicanimation" }
material = { module = "com.google.android.material:material", version.ref = "material" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidxActivity" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidxFragment" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidxLifecycle" }
androidx-lifecycle-livedata = { module = "androidx.lifecycle:lifecycle-livedata", version.ref = "androidxLifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidxLifecycle" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidxRecyclerview" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "androidxSwiperefresh" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "androidxViewpager2" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "androidxCamera" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "androidxCamera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "androidxCamera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "androidxCamera" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "androidxExif" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "androidxWork" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
