<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <meta name="description" content="{{ text }}">
  <meta property="og:site_name" content="Outfit Share">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ text }}">
  <meta property="og:url" content="{{ url }}">
  {% if image %}<meta property="og:image" content="{{ image }}">
  <meta name="twitter:card" content="summary_large_image">{% endif %}
  <style>
    :root { --bg: #F6F2EB; --ink: #1C1B19; --muted: #6B665E; --accent: #2F3BD6; --on-accent: #FFFFFF; --line: #E2DBCF; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161513; --ink: #F2EEE7; --muted: #B5AEA3; --accent: #9AA3FF; --on-accent: #10124A; --line: #34312C; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 32px 16px 48px; }
    .brand { font: 600 22px/1 Georgia, "Times New Roman", serif; letter-spacing: -0.01em; }
    img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 16px; margin: 24px 0; background: var(--line); }
    h1 { font: 500 28px/1.2 Georgia, "Times New Roman", serif; margin: 24px 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    a.button { display: block; min-height: 48px; padding: 12px 16px; border-radius: 999px; text-align: center; text-decoration: none; font-weight: 600; margin-bottom: 12px; }
    .primary { background: var(--accent); color: var(--on-accent); }
    .secondary { border: 1px solid var(--line); color: var(--ink); }
  </style>
</head>
<body>
<main>
  <div class="brand">Outfit Share</div>
  {% if image %}<img src="{{ image }}" alt="{{ title }}">{% endif %}
  <h1>{{ title }}</h1>
  <p>{{ text }}</p>
  <a class="button primary" href="{{ app_link }}">Открыть в приложении</a>
  {% if telegram_link %}<a class="button secondary" href="{{ telegram_link }}">Открыть в Telegram</a>{% endif %}
</main>
</body>
</html>
