<!DOCTYPE html>
<html>
<head>
    <title>Мой мини-апп</title>
    {% load static %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/base.css' %}?v={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'css/profile.css' %}?v={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'css/search.css' %}?v={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'css/messages.css' %}?v={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'css/connections.css' %}?v={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'css/posts.css' %}?v={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'css/constructor.css' %}?v={% now 'U' %}">
    {% if user.avatar %}
        <link rel="preload" as="image" href="{{ user.avatar.url }}">
    {% endif %}
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div id="main-content">
        {% block content %}{% endblock %}
    </div>

    <nav class="bottom-navigation">
        <a href="/home/" class="bottom-navigation__item">
            <i class="ri-home-line bottom-navigation__icon"></i>
            <span class="bottom-navigation__label">Главная</span>
        </a>
        <a href="/search/" class="bottom-navigation__item">
            <i class="ri-search-line bottom-navigation__icon"></i>
            <span class="bottom-navigation__label">Поиск</span>
        </a>
        <a href="/create/" class="bottom-navigation__item">
            <button class="bottom-navigation__action">+</button>
        </a>
        <a href="/messages/" class="bottom-navigation__item">
            <span class="bottom-nav-icon-wrap">
                <i class="ri-message-2-line bottom-navigation__icon"></i>
                <span id="nav-msg-badge" class="nav-msg-badge" style="display:none"></span>
            </span>
            <span class="bottom-navigation__label">Сообщения</span>
        </a>
        <a href="/profile/" class="bottom-navigation__item">
            <i class="ri-user-line bottom-navigation__icon"></i>
            <span class="bottom-navigation__label">Профиль</span>
        </a>
    </nav>

    <script src="{% static 'js/constructor.js' %}?v={% now 'U' %}"></script>
    {% if user %}<script>window.__currentUserId = {{ user.telegram_id }};</script>{% endif %}
    <script src="{% static 'js/posts.js' %}?v={% now 'U' %}"></script>
    <script src="{% static 'js/home.js' %}?v={% now 'U' %}"></script>
    <script src="{% static 'js/profile.js' %}?v={% now 'U' %}"></script>
    <script src="{% static 'js/avatar.js' %}?v={% now 'U' %}"></script>
    <script src="{% static 'js/search.js' %}?v={% now 'U' %}"></script>
    <script src="{% static 'js/user_profile.js' %}?v={% now 'U' %}"></script>
    <script src="{% static 'js/messages.js' %}?v={% now 'U' %}"></script>
    <script src="{% static 'js/connections.js' %}?v={% now 'U' %}"></script>
    <script src="{% static 'js/constructor.js' %}?v={% now 'U' %}"></script>
    <script src="{% static 'js/base.js' %}?v={% now 'U' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
