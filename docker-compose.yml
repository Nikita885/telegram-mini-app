# Outfit Share — production stack (see DEPLOY.md).
#   cp .env.example .env   # fill it in
#   docker compose up -d --build
# The app listens on 127.0.0.1:${APP_PORT:-8010} only; an HTTPS proxy in front of it (nginx on the
# host, or the bundled Caddy: docker compose --profile caddy up -d) makes it public.
# Everything here is namespaced by the project name, so it can share a server with other stacks.
name: outfitshare

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  build: .
  image: outfitshare-backend:latest
  env_file: .env
  environment:
    POSTGRES_HOST: db
    REDIS_URL: redis://redis:6379/0
  volumes:
    - media:/app/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  logging: *logging

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-outfits}
      POSTGRES_USER: ${POSTGRES_USER:-outfits}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  web:
    <<: *app
    command: web
    ports:
      - "127.0.0.1:${APP_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: ${WEB_MEMORY:-1g}

  worker:
    <<: *app
    command: worker
    volumes:
      - media:/app/media
      - models:/app/models
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY:-3g}

  bot:
    <<: *app
    command: bot
    deploy:
      resources:
        limits:
          memory: 256m

  # Optional HTTPS proxy with automatic Let's Encrypt certificates.
  # Only when ports 80/443 on the server are free (no nginx or another proxy there).
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  redisdata:
  media:
  models:
  caddydata:
  caddyconfig:
